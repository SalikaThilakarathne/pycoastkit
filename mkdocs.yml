site_name: pycoastkit
site_description: A toolkit for sandy coasts - storms, beach profiles, shorelines, sandbars, erosion, recovery and vulnerability.
site_author: Salika Thilakarathne
site_url: https://salikathilakarathne.github.io/pycoastkit/
repo_url: https://github.com/SalikaThilakarathne/pycoastkit
repo_name: SalikaThilakarathne/pycoastkit
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Salika Thilakarathne, Helmholtz-Zentrum Hereon &middot; MIT licence

theme:
  name: material
  language: en
  icon:
    logo: material/waves
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit

extra_css:
  - assets/extra.css

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - User guide:
      - guide/index.md
      - Storms: guide/storms.md
      - Beach profiles: guide/beach.md
      - Shoreline: guide/shoreline.md
      - Sandbars: guide/sandbars.md
      - Impacts & recovery: guide/impacts.md
      - Vulnerability: guide/vulnerability.md
      - Waves: guide/waves.md
      - Plots: guide/plots.md
  - Hasaki data: hasaki.md
  - Command line: cli.md
  - API reference:
      - api/index.md
      - storms: api/storms.md
      - beach: api/beach.md
      - shoreline: api/shoreline.md
      - sandbars: api/sandbars.md
      - impacts: api/impacts.md
      - recovery: api/recovery.md
      - vulnerability: api/vulnerability.md
      - waves: api/waves.md
      - skill: api/skill.md
      - plot: api/plot.md
      - hasaki: api/hasaki.md
  - About:
      - Glossary: glossary.md
      - Citing & data sources: citing.md
      - Changelog: changelog.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            separate_signature: true
            show_signature_annotations: false
            merge_init_into_class: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/SalikaThilakarathne/pycoastkit
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/pycoastkit/
